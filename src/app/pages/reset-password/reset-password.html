<div class="min-h-screen flex bg-slate-50 dark:bg-[#080d1a] text-slate-900 dark:text-slate-100 transition-colors relative">

  <button type="button" (click)="themeService.toggleTheme()"
    class="absolute top-4 right-4 z-20 w-9 h-9 rounded-full flex items-center justify-center text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100 bg-white/80 dark:bg-slate-800/80 backdrop-blur border border-slate-200 dark:border-slate-700 shadow-sm transition hover:scale-105 cursor-pointer"
    [title]="themeService.isDark() ? 'Mudar para modo claro' : 'Mudar para modo escuro'">
    <i class="fa-solid" [ngClass]="themeService.isDark() ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'"></i>
  </button>

  <div class="flex-1 flex items-center justify-center px-5 py-8 md:px-8 md:py-12">
    <div class="w-full max-w-[460px]">

      <div class="mb-6 flex flex-col items-center justify-center text-center">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl text-white bg-orange-600 shadow-lg shadow-orange-600/30 mb-4">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 dark:text-slate-100 mb-1">Redefinir Senha</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Crie uma nova senha segura para acessar sua conta CustoPrato</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

        <div class="flex flex-col gap-1.5">
          <label class="text-[11.5px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-[0.4px]">
            Código de Verificação <span class="text-red-500">*</span>
          </label>
          <input formControlName="code" type="text"
            class="w-full bg-white dark:bg-[#0b1120] border border-slate-300 dark:border-slate-700 rounded-xl py-2.5 px-3.5 text-sm font-medium text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 outline-none transition focus:border-orange-500 shadow-sm tracking-widest text-center text-lg font-mono font-bold"
            [ngClass]="err('code') ? 'border-red-400 focus:border-red-400' : ''"
            placeholder="000000" maxlength="6" />
          <span class="text-[11px] text-red-500" *ngIf="err('code')">{{ err('code') }}</span>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[11.5px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-[0.4px]">
            Nova Senha <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <input formControlName="password" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password"
              class="w-full bg-white dark:bg-[#0b1120] border border-slate-300 dark:border-slate-700 rounded-xl py-2.5 pl-3.5 pr-10 text-sm font-medium text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 outline-none transition focus:border-orange-500 shadow-sm"
              [ngClass]="err('password') ? 'border-red-400 focus:border-red-400' : ''"
              placeholder="Digite a nova senha (mínimo 6 caracteres)" />
            <button type="button" (click)="toggleShowPassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition bg-transparent border-none cursor-pointer p-1">
              <i class="fa-solid text-sm" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <span class="text-[11px] text-red-500" *ngIf="err('password')">{{ err('password') }}</span>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[11.5px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-[0.4px]">
            Confirmar Nova Senha <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <input formControlName="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'" autocomplete="new-password"
              class="w-full bg-white dark:bg-[#0b1120] border border-slate-300 dark:border-slate-700 rounded-xl py-2.5 pl-3.5 pr-10 text-sm font-medium text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 outline-none transition focus:border-orange-500 shadow-sm"
              [ngClass]="err('confirmPassword') ? 'border-red-400 focus:border-red-400' : ''"
              placeholder="Repita a nova senha" />
            <button type="button" (click)="toggleShowConfirmPassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition bg-transparent border-none cursor-pointer p-1">
              <i class="fa-solid text-sm" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <span class="text-[11px] text-red-500" *ngIf="err('confirmPassword')">{{ err('confirmPassword') }}</span>
        </div>

        <div class="mt-2">
          <button type="submit" [disabled]="isLoading"
            class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl text-sm font-bold text-white cursor-pointer transition hover:-translate-y-px hover:shadow-[0_4px_12px_rgba(234,88,12,0.3)] bg-orange-600 hover:bg-orange-700 disabled:opacity-55 disabled:cursor-not-allowed disabled:transform-none">
            <i class="fa-solid fa-spinner fa-spin" *ngIf="isLoading"></i>
            <i class="fa-solid fa-check" *ngIf="!isLoading"></i>
            <span>{{ isLoading ? 'Redefinindo...' : 'Salvar Nova Senha' }}</span>
          </button>
        </div>

      </form>

      <div class="flex flex-col items-center gap-3 mt-8 pt-6 border-t border-slate-200 dark:border-slate-800">
        <p class="text-center text-[13px] text-slate-500 dark:text-slate-400">
          Lembrou a senha?
          <a routerLink="/login" class="font-semibold text-orange-600 no-underline hover:underline">
            Fazer Login
          </a>
        </p>
        <p class="text-center text-[13px] text-slate-500 dark:text-slate-400">
          Não tem o código?
          <a routerLink="/forgot-password" class="font-semibold text-orange-600 no-underline hover:underline">
            Solicitar Novamente
          </a>
        </p>
      </div>

    </div>
  </div>
</div>
