<div class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" *ngIf="modal">
  <div
    class="w-full max-w-md bg-white dark:bg-[#0b1120] border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-in fade-in duration-200">
    
    <!-- Cabeçalho -->
    <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/50">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-orange-100 dark:bg-orange-950/50 text-orange-600 flex items-center justify-center text-sm">
          <i class="fa-solid fa-tags"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold text-slate-900 dark:text-white">
            {{ title }}
          </h3>
          <p class="text-[11px] text-slate-400">Cadastre e gerencie os itens desta tabela</p>
        </div>
      </div>
      <button type="button" (click)="close()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition p-1">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- Conteúdo -->
    <div class="p-5 space-y-4 overflow-y-auto">
      
      <!-- Formulário de Criação Rápida -->
      <div>
        <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">
          Novo Item / Categoria <span class="text-red-500">*</span>
        </label>
        <div class="flex items-center gap-2">
          <input type="text" [(ngModel)]="name" (keyup.enter)="create()" placeholder="Ex: Carnes, Bebidas, Sobremesas..."
            class="flex-1 bg-white dark:bg-[#080d1a] border border-slate-300 dark:border-slate-700 rounded-lg py-2 px-3 text-xs font-medium text-slate-900 dark:text-white outline-none focus:border-orange-500 shadow-sm" />
          <button type="button" (click)="create()" [disabled]="isSaving || !name.trim()"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-bold text-white bg-orange-600 hover:bg-orange-700 transition shadow-sm disabled:opacity-50 shrink-0">
            <i *ngIf="!isSaving" class="fa-solid fa-plus text-xs"></i>
            <i *ngIf="isSaving" class="fa-solid fa-spinner fa-spin text-xs"></i>
            <span>{{ isSaving ? 'Salvando...' : 'Adicionar' }}</span>
          </button>
        </div>
      </div>

      <!-- Divisor -->
      <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">
            Itens Cadastrados ({{ items.length }})
          </span>
          <span *ngIf="isLoading" class="text-[10px] text-orange-500 flex items-center gap-1">
            <i class="fa-solid fa-spinner fa-spin"></i> Atualizando...
          </span>
        </div>

        <!-- Lista de Itens -->
        <div class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
          <div *ngFor="let item of items"
            class="flex items-center justify-between px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-900/60 border border-slate-200/70 dark:border-slate-800 hover:border-orange-300 dark:hover:border-orange-900/60 transition group">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-orange-500"></span>
              <span class="text-xs font-semibold text-slate-800 dark:text-slate-200">{{ item.name }}</span>
            </div>
            <button type="button" (click)="delete(item)" [disabled]="deletingId === item.id"
              class="w-6 h-6 rounded flex items-center justify-center text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition opacity-80 group-hover:opacity-100"
              title="Excluir">
              <i *ngIf="deletingId !== item.id" class="fa-solid fa-trash text-[11px]"></i>
              <i *ngIf="deletingId === item.id" class="fa-solid fa-spinner fa-spin text-[11px] text-rose-500"></i>
            </button>
          </div>

          <!-- Estado Vazio -->
          <div *ngIf="!isLoading && items.length === 0" class="text-center py-6 text-slate-400 text-xs">
            <i class="fa-regular fa-folder-open text-xl mb-1.5 block text-slate-300 dark:text-slate-700"></i>
            Nenhuma categoria cadastrada ainda.
          </div>
        </div>
      </div>

    </div>

    <!-- Rodapé -->
    <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 flex items-center justify-end">
      <button type="button" (click)="close()"
        class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        Concluir
      </button>
    </div>

  </div>
</div>
